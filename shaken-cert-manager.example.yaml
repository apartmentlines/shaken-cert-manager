# Example shaken-cert-manager configuration.
# See README.md for setup, operations, and monitoring guidance.
# See docs/configuration.md for configuration details.
# See docs/subject-templates.md for certificate subject templating.

# Enables certificate management. When false, status remains disabled and renew does not issue certificates.
# Possible values: true, false.
# enabled: true

# Selects the Peeringhub/STI-PA environment used for ACME issuance and SPC token requests.
# Possible values: staging, production.
# peeringhub_environment: production

# Identifies this server in generated certificate generation IDs.
# Required.
# server_id:

# STI-PA service provider code authorized for this deployment.
# Required when enabled is true.
# stipa_spc:

# STI-PA service provider account ID used in STI-PA token API paths.
# Defaults to stipa_spc when unset.
# stipa_sp_id:

# Country for generated SHAKEN certificate subjects.
# Possible values: US.
# shaken_subject_country: US

# State for generated SHAKEN certificate subjects.
# Required when enabled is true.
# shaken_subject_state:

# Locality/city for generated SHAKEN certificate subjects.
# Required when enabled is true.
# shaken_subject_locality:

# Organization for generated SHAKEN certificate subjects.
# Required when enabled is true.
# shaken_subject_organization:

# Organizational unit for generated SHAKEN certificate subjects.
# shaken_subject_organizational_unit: VoIP

# Strategy for generating certificate subject CN values when no CN template is set.
# Possible values: unique_per_generation, stable_common_name.
# subject_strategy: unique_per_generation

# Python format template for the subject commonName. See docs/subject-templates.md.
# Available fields: server_id, generation_id, stipa_spc, organization.
# shaken_subject_common_name_template:

# STI-PA login user ID for requesting SPC tokens.
# Required when enabled is true.
# stipa_user_id:

# STI-PA login password for requesting SPC tokens.
# Required when enabled is true.
# stipa_password:

# Overrides the Peeringhub ACME base URL from stir-shaken-toolkit provider defaults.
# Leave empty for the toolkit default for peeringhub_environment.
# acme_base_url_override:

# Peeringhub-provided ACME KID/account identifier.
# Obtain this value from Peeringhub before issuing certificates.
# Required when enabled is true.
# acme_kid:

# Directory containing the ACME account key and state cache when explicit paths are not set.
# Defaults to [state_dir]/account.
# account_dir:

# ACME account private key path. This is durable Peeringhub account identity
# material and must exist before issuance. Create it manually with
# stir-shaken-toolkit peeringhub-account-setup, or provision an existing key.
# Defaults to [account_dir]/account.key.
# acme_account_key_path:

# ACME account state cache path. This file is recoverable cache; if it is
# missing but acme_account_key_path exists, shaken-cert-manager refreshes it
# from Peeringhub before issuance.
# Defaults to [account_dir]/account.json.
# acme_account_state_path:

# Optional network timeout in seconds for ACME requests.
# Defaults to stir-shaken-toolkit behavior when unset.
# acme_timeout_seconds:

# Optional poll interval in seconds while waiting for ACME order status changes.
# Defaults to stir-shaken-toolkit behavior when unset.
# acme_poll_interval_seconds:

# Optional maximum seconds to poll an ACME order before treating issuance as failed.
# Defaults to stir-shaken-toolkit behavior when unset.
# acme_poll_timeout_seconds:

# Optional number of retries after an ACME badNonce response.
# Defaults to stir-shaken-toolkit behavior when unset.
# acme_bad_nonce_retries:

# Overrides the STI-PA base URL from stir-shaken-toolkit provider defaults.
# Leave empty for the toolkit default for peeringhub_environment.
# stipa_base_url_override:

# Optional network timeout in seconds for STI-PA requests.
# Defaults to stir-shaken-toolkit behavior when unset.
# stipa_timeout_seconds:

# Overrides the STI-PA CRL URL expected in SPC tokens.
# Leave empty for the toolkit default for peeringhub_environment.
# stipa_crl_url_override:

# Optional requested certificate notBefore timestamp.
# Leave unset to use the Peeringhub/toolkit default start time.
# Use the timestamp format accepted by stir-shaken-toolkit/Peeringhub ACME.
# not_before:

# Optional requested certificate notAfter timestamp.
# Set this to request a shorter or longer certificate validity period.
# Leave unset to use the Peeringhub/toolkit default expiration time.
# Use the timestamp format accepted by stir-shaken-toolkit/Peeringhub ACME.
# not_after:

# Days before certificate expiration when renew should issue a replacement.
# renew_before_days: 45

# Days before certificate expiration when status should report WARNING.
# warning_days: 30

# Minimum acceptable issued certificate lifetime in days. This does not request
# the certificate length; it controls issuance validation and CRITICAL status.
# Lower this for intentionally short-lived certificates, such as one-day tests.
# minimum_certificate_lifetime_days: 14

# Days after expiration to keep archived certificate generations before cleanup.
# retention_days_after_expiry: 30

# Optional command executed after a new certificate generation is archived and linked
# under live/<generation_id>, but before live/current is activated. A non-zero exit
# rolls back the new live generation link and fails issuance.
# The hook receives SHAKEN_* environment variables for the new generation, but not
# live/current values because live/current still points at the previous generation.
# pre_activate_hook:

# Maximum seconds to allow the pre-activation hook to run.
# pre_activate_hook_timeout_seconds: 60

# Optional command executed after live/current and active.json are updated. A non-zero
# exit is logged, but does not roll back the successful certificate activation.
# The hook receives SHAKEN_* environment variables describing the active generation.
# deploy_hook:

# Maximum seconds to allow the deploy hook to run.
# deploy_hook_timeout_seconds: 60

# Keeps failed transaction directories for later inspection.
# Possible values: true, false.
# retain_failed_transactions: true

# Maximum number of failed transaction directories to retain.
# max_failed_transactions_retained: 10

# Includes CRL Distribution Points in generated CSRs.
# Peeringhub issuance currently works with this disabled.
# Possible values: true, false.
# include_crl_distribution_points: false

# Base state directory for manager-owned files.
# Other manager-owned paths default under this directory.
# state_dir: /var/lib/shaken

# Temporary working directory used during issuance.
# Defaults to [state_dir]/work.
# work_dir:

# Archive directory for completed certificate generations.
# Defaults to [state_dir]/archive.
# archive_dir:

# Live symlink directory exposing unexpired generations and live/current.
# Defaults to [state_dir]/live.
# live_dir:

# Directory for retained failed transactions.
# Defaults to [state_dir]/failed.
# failed_dir:

# Path to the active generation manifest.
# Defaults to [state_dir]/active.json.
# active_manifest_path:

# Path to the last issuance attempt result.
# Defaults to [state_dir]/last-attempt.json.
# last_attempt_path:

# Lock file path used to serialize manager operations.
# Defaults to [state_dir]/shaken-cert-manager.lock.
# lock_path:
