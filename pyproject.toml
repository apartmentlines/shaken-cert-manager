[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaken-cert-manager"
dynamic = ["version"]
description = "SHAKEN certificate issuance and renewal lifecycle manager (Certbot for SHAKEN Certs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "argcomplete>=3",
  "cryptography>=41",
  "PyYAML>=6.0",
  "stir-shaken-toolkit",
]

[project.urls]
Homepage = "https://github.com/peeringhub-io/shaken-cert-manager"
Repository = "https://github.com/peeringhub-io/shaken-cert-manager"
Issues = "https://github.com/peeringhub-io/shaken-cert-manager/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "basedpyright",
]

[project.scripts]
shaken-cert-manager = "shaken_cert_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "shaken_cert_manager.version.__version__"}
